services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-parcelpilot}
      POSTGRES_USER: ${POSTGRES_USER:-parcelpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-parcelpilot} -d ${POSTGRES_DB:-parcelpilot}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    command: ["/app/entrypoint.sh"]
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DOCS_DIR: /docs
      DEBUG: "false"
    volumes:
      - pp_media:/app/media
      - pp_static:/app/staticfiles
      - ./Docs for implementation:/docs:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE: ""
    ports:
      - "80:80"
    volumes:
      - pp_media:/var/www/media:ro
      - pp_static:/var/www/static:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pp_pgdata:
  pp_media:
  pp_static:
